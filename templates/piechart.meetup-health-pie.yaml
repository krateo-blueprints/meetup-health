apiVersion: widgets.templates.krateo.io/v1beta1
kind: PieChart
metadata:
  name: meetup-health-pie
  namespace: '{{ include "page.tierNamespace" (dict "ctx" . "tier" "common") }}'
spec:
  apiRef:
    name: meetup-health-sites
    namespace: krateo-system
  resourcesRefs:
    items: []
  widgetData:
    angleField: count
    colorField: health
    colorMap:
      Failing: red
      Progressing: orange
      Ready: green
    data: []
    innerRadius: 60
    legendPosition: right
  widgetDataTemplate:
    - expression: '${ [ (.items // [])[] | (.health // "Unknown") ] | group_by(.) | map({ health: .[0], count: length }) }'
      forPath: data
